name: Deploy Lambda API
on:
  push:
    branches:
      - terraform-test
  workflow_dispatch:
jobs:
  build:
    name: Build Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0'

      - name: Build .NET Lambda package
        run: |
          cd src/CodeDaily.API
          dotnet restore
          dotnet build --configuration Release
          dotnet publish --configuration Release --runtime linux-x64 --self-contained false --output ./publish
          cd publish && zip -r ../../../lambda-package.zip .

      - name: Upload Lambda package
        uses: actions/upload-artifact@v4
        with:
          name: lambda-package
          path: lambda-package.zip
          retention-days: 1

  infrastructure:
    name: Deploy Infrastructure
    needs: [build]
    runs-on: ubuntu-latest
    outputs:
      lambda_function_name: ${{ steps.tf_output.outputs.lambda_function_name }}
      api_gateway_url: ${{ steps.tf_output.outputs.api_gateway_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ~1.6.0
          terraform_wrapper: false

      - name: Create Terraform state bucket (ignore if exists)
        run: |
          aws s3 mb s3://codedaily-terraform-state-east-2 --region us-east-2 || true
          aws dynamodb create-table \
            --table-name terraform-state-lock \
            --attribute-definitions AttributeName=LockID,AttributeType=S \
            --key-schema AttributeName=LockID,KeyType=HASH \
            --billing-mode PAY_PER_REQUEST \
            --region us-east-2 || true

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Remove SSM parameters from state
        working-directory: terraform
        run: |
          terraform state rm aws_ssm_parameter.jwt_private_key || true
          terraform state rm aws_ssm_parameter.jwt_public_key || true
          terraform state rm aws_ssm_parameter.jwt_expiration || true

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve

      - name: Get Terraform outputs
        id: tf_output
        working-directory: terraform
        run: |
          echo "lambda_function_name=$(terraform output -raw lambda_function_name)" >> $GITHUB_OUTPUT
          echo "api_gateway_url=$(terraform output -raw api_gateway_url)" >> $GITHUB_OUTPUT

  deploy:
    name: Deploy Application
    needs: [infrastructure]
    runs-on: ubuntu-latest
    steps:
      - name: Download Lambda package
        uses: actions/download-artifact@v4
        with:
          name: lambda-package

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Update Lambda function code
        run: |
          aws lambda update-function-code \
            --function-name ${{ needs.infrastructure.outputs.lambda_function_name }} \
            --zip-file fileb://lambda-package.zip \
            --region us-east-2

      - name: Wait for Lambda update completion
        run: |
          aws lambda wait function-updated \
            --function-name ${{ needs.infrastructure.outputs.lambda_function_name }} \
            --region us-east-2

      - name: Display API URL
        run: |
          echo "API URL: ${{ needs.infrastructure.outputs.api_gateway_url }}"